<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fafaf7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121315" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="해커톤 레이더">
<title>해커톤 레이더</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<style>
:root{
  --bg:#fafaf7;--text:#16171a;--sub:#6f7276;--line:#e5e4de;--hover:#f1f0ea;
  --accent:#e0481f;--check:#16171a;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#121315;--text:#ececea;--sub:#8d9095;--line:#2a2b2e;--hover:#1a1b1e;
  --accent:#ff6a3d;--check:#ececea;
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);
  font:15px/1.55 "Pretendard Variable",Pretendard,-apple-system,"Malgun Gothic",sans-serif;
  font-feature-settings:"tnum" 1;letter-spacing:-.01em;word-break:keep-all;overflow-wrap:break-word}
main{max-width:820px;margin:0 auto;padding:40px 20px 80px}

header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;
  padding-bottom:16px;border-bottom:2px solid var(--text)}
h1{margin:0;font-size:20px;font-weight:700;letter-spacing:-.03em}
.updated{font-size:13px;color:var(--sub)}

.filters{display:flex;flex-wrap:wrap;gap:6px 22px;padding:14px 0;border-bottom:1px solid var(--line)}
.filters label{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:14px;user-select:none}
.filters input{appearance:none;margin:0;width:16px;height:16px;border:1.5px solid var(--sub);border-radius:4px;
  display:grid;place-content:center;cursor:pointer;background:transparent}
.filters input:checked{background:var(--check);border-color:var(--check)}
.filters input:checked::after{content:"";width:8px;height:4px;border:solid var(--bg);border-width:0 0 2px 2px;
  transform:translateY(-1px) rotate(-45deg)}
.hint{color:var(--sub);font-size:12px}
.filters input:focus-visible,select:focus-visible,input[type=search]:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.views{display:flex;gap:20px;border-bottom:1px solid var(--line)}
.views button{border:0;background:transparent;color:var(--sub);font:inherit;font-size:15px;padding:12px 0;cursor:pointer;
  border-bottom:2px solid transparent;margin-bottom:-1px}
.views button[aria-selected=true]{color:var(--text);font-weight:600;border-bottom-color:var(--text)}
.scrap{position:absolute;right:0;top:20px;border:0;background:transparent;color:var(--sub);cursor:pointer;padding:8px;line-height:0}
.scrap svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linejoin:round}
.scrap[aria-pressed=true]{color:var(--accent)}
.scrap[aria-pressed=true] svg{fill:currentColor}
.title{padding-right:34px}
.tools{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;flex-wrap:wrap}
.count{font-size:13px;color:var(--sub)}
.count b{color:var(--text);font-weight:600}
.right{display:flex;gap:16px;align-items:center}
input[type=search]{width:170px;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--text);
  font:inherit;font-size:14px;padding:4px 0;border-radius:0}
input[type=search]::placeholder{color:var(--sub)}
select{border:0;background:transparent;color:var(--text);font:inherit;font-size:14px;cursor:pointer;padding:4px 0}

.row{display:grid;grid-template-columns:84px 1fr;column-gap:20px;padding:22px 0 22px 14px;
  border-top:1px solid var(--line);position:relative;margin-left:-14px}
@media(hover:hover){.row:hover{background:var(--hover)}}
a,button,label{-webkit-tap-highlight-color:transparent}
.row.fit::before{content:"";position:absolute;left:0;top:22px;bottom:22px;width:2px;background:var(--accent)}
.dd{font-size:24px;font-weight:700;letter-spacing:-.03em;line-height:1.15}
.dd small{display:block;font-size:12px;font-weight:500;color:var(--sub);letter-spacing:0;margin-top:2px}
.dd.soon{color:var(--accent)}
.title{font-size:17px;font-weight:650;line-height:1.4;letter-spacing:-.02em}
.title a{color:inherit;text-decoration:none;background:linear-gradient(currentColor,currentColor) 0 100%/0 1px no-repeat;transition:background-size .2s}
.title a:hover{background-size:100% 1px}
.meta{font-size:13px;color:var(--sub);margin-top:3px}
.meta .hl{color:var(--accent);font-weight:600}
.facts{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:12px 28px;margin:14px 0 0}
.facts div{min-width:0}
dt{font-size:12px;color:var(--sub);margin-bottom:1px}
dd{margin:0;font-size:14px}
.na{color:var(--sub)}
.wk{font-weight:600;text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:2px;text-underline-offset:3px}
.why{color:var(--sub);font-weight:500}
.more{display:flex;justify-content:space-between;width:100%;margin:8px 0;padding:14px 0;border:0;border-top:2px solid var(--text);border-bottom:1px solid var(--line);
  background:transparent;color:var(--text);font:inherit;font-weight:600;cursor:pointer;text-align:left}
.more span{color:var(--sub);font-weight:400;font-size:13px}
.topic{margin-top:12px;font-size:13px;color:var(--sub)}
.topic span+span::before{content:"·";margin:0 6px}

.empty{padding:56px 0;text-align:center;color:var(--sub);border-top:1px solid var(--line)}
.err{font-size:13px;color:var(--accent);padding:10px 0}
footer{margin-top:28px;padding-top:16px;border-top:2px solid var(--text);font-size:12px;color:var(--sub)}

@media(max-width:640px){
  /* 아이폰 17 (402px) 기준: 노치/홈 인디케이터 여백, 44px 터치 영역, 16px 입력창(사파리 자동 확대 방지) */
  main{padding:max(28px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(64px,calc(env(safe-area-inset-bottom) + 32px)) max(16px,env(safe-area-inset-left))}
  h1{font-size:22px}
  .filters{gap:0 18px;padding:4px 0}
  .filters label{min-height:44px;font-size:15px}
  .filters input{width:22px;height:22px;border-radius:6px}
  .filters input:checked::after{width:11px;height:6px}
  .hint{display:none}
  .tools{padding:8px 0 12px}
  .right{width:100%;gap:12px}
  input[type=search]{flex:1;width:auto;font-size:16px;padding:8px 0}
  select{font-size:16px;padding:8px 0}
  .more{min-height:48px}
  .title{font-size:18px}
  .row{grid-template-columns:1fr;padding-left:0;margin-left:0}
  .row.fit::before{display:none}
  .row.fit{box-shadow:inset 2px 0 0 var(--accent);padding-left:12px}
  .dd{display:flex;align-items:baseline;gap:8px;font-size:20px;margin-bottom:6px}
  .dd small{display:inline;margin:0}
  .facts{grid-template-columns:1fr 1fr}
  .facts .wide{grid-column:1/-1}
  input[type=search]{width:120px}
}
</style>
</head>
<body>
<main>
  <header>
    <h1>해커톤 레이더</h1>
    <span class="updated" id="updated"></span>
  </header>

  <div class="filters" role="group" aria-label="필터">
    <label><input type="checkbox" data-f="univOnly">대학생 전용</label>
    <label><input type="checkbox" data-f="seoul">서울 기준 <span class="hint">현장 참석 없는 온라인 제출 · 교통비 지원 포함</span></label>
    <label><input type="checkbox" data-f="weekend">주말 포함</label>
  </div>

  <div class="views" role="tablist" aria-label="보기">
    <button role="tab" data-v="all" aria-selected="true">전체</button>
    <button role="tab" data-v="scrap" aria-selected="false">스크랩 <span id="scrapN"></span></button>
  </div>

  <div class="tools">
    <span class="count" id="count"></span>
    <div class="right">
      <input id="q" type="search" placeholder="검색" aria-label="검색">
      <select id="sort" aria-label="정렬">
        <option value="deadline">마감 임박순</option>
        <option value="fit">맞춤순</option>
        <option value="event">행사 빠른순</option>
        <option value="prize">상금 높은순</option>
        <option value="new">새로 올라온 순</option>
      </select>
    </div>
  </div>

  <div id="err" class="err" hidden></div>
  <div id="list"></div>
  <footer>위비티 · 링커리어에서 6시간마다 수집합니다. 접수 마감된 행사, 상금 없는 행사(구독권 등 비현금 포함), 참가비 있는 행사는 제외합니다. 스크랩은 이 기기 브라우저에만 저장됩니다. 일정과 상금은 본문에서 자동으로 읽은 값이라 신청 전 원문을 확인하세요.</footer>
</main>
<script>
const $=id=>document.getElementById(id);
const safe=(f,d)=>{try{return f()}catch{return d}};
const lastVisit=safe(()=>localStorage.getItem('lastVisit'),null);
// 기본: 대학생 전용 + 서울 기준 (상금 없는 건 항상 제외)
const prefs=Object.assign({univOnly:true,seoul:true,weekend:false},safe(()=>JSON.parse(localStorage.getItem('prefs2')||'{}'),{}));
const WD=['일','월','화','수','목','금','토'];
const T=i=>i.target||'';
const univOnly=i=>/대학|재학/.test(T(i))&&!/일반|직장|제한|전체|누구/.test(T(i));
const eligible=i=>i.univ||!T(i)||/제한|전체|누구|일반|청년/.test(T(i));   // 대학생이 신청 가능한가
// 서울 기준: 현장에 안 가도 되면(온라인 제출·온라인 개최) 지역과 무관. 가야 한다면 서울이거나 교통비 지원이 있어야 함
const reachable=i=>i.inperson===false||i.online||i.region==='서울'||i.travel||!i.region;
// 상금: 현금 상금이 확인된 것만 기본 목록. 상금 없음·구독권 같은 비현금 보상은 완전 제외, 상금 미확인은 확장 쪽
const noPrize=i=>i.prize_won===0||i.noncash||/없음|무상금/.test(i.prize||'');
const cashPrize=i=>i.prize_won>0;
const paid=i=>i.paid===true;   // 참가비 있는 행사는 완전 제외
let items=[],moreOpen=null,view='all';
// 스크랩: 이 기기 브라우저에만 저장됨
const scraps=new Set(safe(()=>JSON.parse(localStorage.getItem('scraps')||'[]'),[]));
const ids=i=>i.merged_ids||[i.id];
const isScrap=i=>ids(i).some(m=>scraps.has(m));
const saveScraps=()=>safe(()=>localStorage.setItem('scraps',JSON.stringify([...scraps])));
const day=d=>new Date(d+'T00:00:00+09:00');
const dleft=d=>d?Math.round((day(d)-new Date().setHours(0,0,0,0))/864e5):null;
const opened=i=>!i.apply_start||day(i.apply_start)<=new Date();
const md=d=>{const x=day(d);return `${x.getMonth()+1}/${x.getDate()}(${WD[x.getDay()]})`};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const range=(a,b)=>(!b||a===b)?md(a):`${md(a)} – ${md(b)}`;
const na=t=>`<span class="na">${t}</span>`;
const score=i=>(univOnly(i)?4:0)+(reachable(i)?2:0)+(i.weekend?3:0)+(i.prize_won?Math.min(2,i.prize_won/5e6):0)-(i.left!==null&&i.left<=2?1:0);

function placeHtml(i){
  if(i.online)return '온라인';
  if(i.inperson===false)return '온라인 제출 '+na('현장 참석 없음');
  if(!i.region)return na('확인 필요');
  const t=i.travel?' <span class="wk">교통비 지원</span>':'';
  const place=i.place&&i.region!=='서울'?` <span class="na">${esc(i.place.split(/[(,]/)[0].trim())}</span>`:'';
  return esc(i.region)+place+t;
}
function soloHtml(i){
  const sz=i.team_size?` <span class="na">${esc(i.team_size)}</span>`:'';
  if(i.solo===true)return '<span class="wk">개인 가능</span>'+sz;
  if(i.solo===false)return '팀만'+sz;
  return na('확인 필요')+sz;
}
function card(i,reason){
  const fit=univOnly(i)&&i.weekend, soon=i.left!==null&&i.left<=3;
  const topic=[i.topic,...(i.tags||[])].filter(Boolean).map(t=>`<span>${esc(t)}</span>`).join('');
  const apply=`${i.apply_start?md(i.apply_start)+' – ':'~ '}${i.deadline?md(i.deadline):'?'} 접수`;
  const flags=[i.isNew&&'NEW',fit&&'맞춤'].filter(Boolean).map(t=>`<span class="hl">${t}</span>`);
  if(reason)flags.push(`<span class="why">${reason}</span>`);
  const sc=isScrap(i);
  return `<article class="row ${fit?'fit':''}">
    <button class="scrap" data-id="${esc(i.id)}" aria-pressed="${sc}" aria-label="${sc?'스크랩 해제':'스크랩'}">
      <svg viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4.5L6 21z"/></svg></button>
    <div class="dd ${soon?'soon':''}">${i.left===null?'':i.left===0?'오늘':'D-'+i.left}<small>접수 중</small></div>
    <div>
      <div class="title"><a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.title)}</a></div>
      <div class="meta">${flags.length?flags.join(' · ')+' · ':''}${esc(i.host)}${i.host?' · ':''}${esc(i.source)} · ${apply}</div>
      <dl class="facts">
        <div><dt>상금</dt><dd>${i.prize?esc(i.prize)+(i.prize_first?` <span class="na">(1등 ${esc(i.prize_first)})</span>`:''):na('확인 필요')}</dd></div>
        <div><dt>대상</dt><dd>${i.target?esc(i.target):na('확인 필요')}</dd></div>
        <div><dt>장소</dt><dd>${placeHtml(i)}</dd></div>
        <div><dt>참가 방식</dt><dd>${soloHtml(i)}</dd></div>
        <div class="wide"><dt>행사 일정</dt><dd>${i.event_start
          ?`<span class="${i.weekend?'wk':''}">${range(i.event_start,i.event_end)}</span>${i.weekend?' 주말 포함':''}`
          :na('본문에서 못 찾음')}</dd></div>
        <div><dt>참가비</dt><dd>${i.paid===false?'무료':na('확인 필요')}</dd></div>
      </dl>
      ${topic?`<div class="topic">${topic}</div>`:''}
    </div>
  </article>`;
}

function render(){
  const q=$('q').value.trim().toLowerCase(), sort=$('sort').value;
  items.forEach(i=>{i.left=dleft(i.deadline);i.isNew=!!lastVisit&&i.first_seen>lastVisit});
  const by={
    fit:(a,b)=>score(b)-score(a)||(a.left??999)-(b.left??999),
    deadline:(a,b)=>(a.left??999)-(b.left??999),
    event:(a,b)=>(a.event_start||'9').localeCompare(b.event_start||'9'),
    prize:(a,b)=>(b.prize_won||0)-(a.prize_won||0),
    new:(a,b)=>b.first_seen.localeCompare(a.first_seen)}[sort];
  // 접수 중(마감 안 지남·접수 시작함)인 것만. 상금 없음·참가비 있음은 항상 제외
  const live=items.filter(i=>(i.left===null||i.left>=0)&&opened(i)&&!noPrize(i)&&!paid(i));
  const nScrap=live.filter(isScrap).length;
  $('scrapN').textContent=nScrap?`(${nScrap})`:'';
  document.querySelectorAll('.views button').forEach(b=>b.setAttribute('aria-selected',b.dataset.v===view));
  const searched=live.filter(i=>(i.title+i.host+(i.topic||'')+(i.tags||[]).join(' ')).toLowerCase().includes(q));
  if(view==='scrap'){   // 스크랩 보기: 필터와 상관없이 저장한 것만
    const rows=searched.filter(isScrap).sort(by);
    $('count').innerHTML=`스크랩 <b>${rows.length}</b>건`;
    $('list').innerHTML=rows.map(i=>card(i)).join('')||'<div class="empty">스크랩한 해커톤이 없어요. 카드 오른쪽 위 책갈피를 눌러 저장하세요.</div>';
    return;
  }
  const base=searched.filter(i=>!prefs.weekend||i.weekend);
  // 해커톤류(~톤·잼·바이브코딩 포함)이고 현금 상금이 확인된 것만 기본 목록. 개발 경진대회(kind=loose)와 상금 미확인은 확장 쪽으로
  const main=base.filter(i=>i.kind!=='loose'&&cashPrize(i)&&(!prefs.univOnly||univOnly(i))&&(!prefs.seoul||reachable(i))).sort(by);
  // 확장: 조건을 완화하면 나오는 것 (전 연령 가능 / 지방 개최 / 개발 경진대회 / 상금 확인 필요). 대학생이 신청 가능한 것만
  const widened=base.filter(i=>!main.includes(i)&&eligible(i)).sort(by);
  const open=moreOpen===null?main.length<3:moreOpen;
  let html=main.map(i=>card(i)).join('')||'<div class="empty">기본 조건에 맞는 해커톤이 없어요.</div>';
  if(widened.length){
    html+=`<button class="more" id="more" aria-expanded="${open}">조건을 넓혀서 보기 · ${widened.length}건
      <span>${open?'접기':'펼치기'}</span></button>`;
    if(open)html+=widened.map(i=>card(i,[i.kind==='loose'&&'개발 경진대회',!cashPrize(i)&&'상금 확인 필요',prefs.univOnly&&!univOnly(i)&&'전 연령 가능',prefs.seoul&&!reachable(i)&&'지방 개최'].filter(Boolean).join(' · '))).join('');
  }
  $('count').innerHTML=`기본 조건 <b>${main.length}</b>건`+(widened.length?` · 넓히면 +${widened.length}`:'');
  $('list').innerHTML=html;
  const m=$('more');if(m)m.onclick=()=>{moreOpen=!open;render()};
}

// 스크랩 토글 / 보기 전환
$('list').addEventListener('click',e=>{
  const b=e.target.closest('.scrap');if(!b)return;
  const it=items.find(i=>i.id===b.dataset.id);if(!it)return;
  if(isScrap(it))ids(it).forEach(m=>scraps.delete(m));else scraps.add(it.id);
  saveScraps();render();
});
document.querySelectorAll('.views button').forEach(b=>b.onclick=()=>{view=b.dataset.v;render()});

document.querySelectorAll('.filters input').forEach(c=>{
  c.checked=!!prefs[c.dataset.f];
  c.onchange=()=>{prefs[c.dataset.f]=c.checked;render();safe(()=>localStorage.setItem('prefs2',JSON.stringify(prefs)))};
});
fetch('data/hackathons.json',{cache:'no-store'}).then(r=>r.json()).then(d=>{
  items=d.items;
  const n=lastVisit?items.filter(i=>i.first_seen>lastVisit).length:0;
  $('updated').textContent=`${d.updated.replace('T',' ').slice(0,16)} 갱신`+(n?` · 새 글 ${n}건`:'');
  if(n)document.title=`(${n}) 해커톤 레이더`;
  if(d.errors&&d.errors.length){$('err').hidden=false;$('err').textContent='일부 사이트 수집 실패: '+d.errors.join(' / ')}
  render();
  safe(()=>localStorage.setItem('lastVisit',new Date().toISOString().slice(0,19)));
}).catch(()=>{$('list').innerHTML='<div class="empty">데이터를 불러오지 못했어요</div>'});
$('q').oninput=render;$('sort').onchange=render;
</script>
</body>
</html>
